<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Proofly · Signature request</title>
<link rel="icon" type="image/png" href="/proofly-logo.png">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f0; color: #17171a; padding: 16px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 8px; margin: 8px 0 16px; color: #444; font-size: 14px; font-weight: 600; letter-spacing: 0.4px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 3px; background: #29d1c7; }
  .card { background: #fff; border: 1px solid #e2e2da; border-radius: 16px; padding: 20px; margin-bottom: 14px; box-shadow: 0 8px 24px rgba(20,20,30,0.06); }
  h1 { font-size: 20px; margin-bottom: 6px; }
  h2 { font-size: 15px; margin-bottom: 4px; }
  p.sub { color: #5b5b57; font-size: 14px; line-height: 1.45; }
  .doc-title { font-weight: 600; }
  .msg { background: #f7f7f2; border-radius: 10px; padding: 10px 12px; font-size: 14px; color: #44443f; margin-top: 10px; white-space: pre-wrap; }
  #pdf-pages { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .pdf-page { position: relative; border: 1px solid #e2e2da; border-radius: 8px; background: #fff; overflow: hidden; }
  .pdf-page.placeable { cursor: crosshair; }
  .pdf-page canvas { width: 100%; height: auto; display: block; }
  .page-num { position: absolute; top: 6px; right: 8px; background: rgba(20,20,26,0.55); color: #fff; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 8px; pointer-events: none; }
  .sig-chip { position: absolute; border: 2px dashed #12ada4; border-radius: 6px; background: rgba(41,209,199,0.12); touch-action: none; cursor: grab; display: flex; align-items: center; justify-content: center; }
  .sig-chip img { max-width: 92%; max-height: 82%; pointer-events: none; }
  .sig-chip .chip-hint { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: #12ada4; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px; }
  .pdf-link { display: inline-block; margin-top: 10px; font-size: 14px; color: #0a7f78; font-weight: 600; text-decoration: none; }
  .place-banner { display: none; position: sticky; top: 8px; z-index: 5; background: #0f8f88; color: #fff; font-size: 13px; font-weight: 600; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 6px 18px rgba(15,143,136,0.35); }
  .place-banner.placed { background: #17171a; }
  label { display: block; font-size: 13px; font-weight: 600; color: #44443f; margin: 14px 0 6px; }
  input[type="text"] { width: 100%; font-size: 16px; padding: 11px 12px; border: 1px solid #d8d8d0; border-radius: 10px; background: #fbfbf8; }
  .sig-box { position: relative; margin-top: 6px; }
  #sig-canvas { width: 100%; height: 180px; border: 1px dashed #b9b9af; border-radius: 12px; background: #fff; touch-action: none; display: block; }
  .sig-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #b3b3aa; font-size: 14px; pointer-events: none; }
  .sig-actions { margin-top: 8px; display: flex; gap: 16px; }
  .link-btn { background: none; border: none; color: #0a7f78; font-size: 14px; font-weight: 600; cursor: pointer; padding: 4px 0; }
  .consent { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; font-size: 13px; color: #44443f; line-height: 1.45; }
  .consent input { margin-top: 2px; width: 18px; height: 18px; flex-shrink: 0; }
  button.primary { width: 100%; margin-top: 18px; padding: 14px; font-size: 16px; font-weight: 700; color: #fff; background: #12ada4; border: none; border-radius: 12px; cursor: pointer; }
  button.primary:disabled { background: #b9d9d6; cursor: default; }
  .error { display: none; margin-top: 12px; color: #b02a2a; font-size: 14px; }
  .footer { text-align: center; color: #8a8a82; font-size: 12px; margin: 18px 0; line-height: 1.5; }
  .status-icon { font-size: 34px; margin-bottom: 10px; }
  .success { text-align: center; padding: 10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span>Proofly · Signature request</div>
  <div id="content">
    <div class="card"><p class="sub">Loading signature request…</p></div>
  </div>
  <div class="footer">Signed electronically through Proofly Ask Sign.<br>A record of the signature, time, and document hash is kept for verification.</div>
</div>

<script>
(function () {
  var FUNCTION_URL = "https://zvwixgdclmrhopsbuqld.supabase.co/functions/v1/sign-request";
  // Matches the iOS stamp box (176 x 80 pt on a 612 pt letter page) so the web
  // preview shows the same footprint the app will render.
  var CHIP_WIDTH_FRACTION = 176 / 612;
  var CHIP_ASPECT = 80 / 176;

  var token = new URLSearchParams(window.location.search).get("token") || "";
  var content = document.getElementById("content");

  function escapeHTML(value) {
    return String(value == null ? "" : value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function statusCard(title, detail) {
    content.innerHTML = '<div class="card"><div class="status-icon">✳️</div><h1>' + escapeHTML(title) + '</h1><p class="sub">' + escapeHTML(detail) + '</p></div>';
  }

  if (!token) {
    statusCard("Invalid link", "This signing link is missing its token.");
    return;
  }

  fetch(FUNCTION_URL + "?token=" + encodeURIComponent(token) + "&format=json")
    .then(function (response) {
      return response.json().then(function (payload) { return { ok: response.ok, payload: payload }; });
    })
    .then(function (result) {
      var payload = result.payload || {};
      if (!result.ok) {
        if (payload.error === "not_found") {
          statusCard("Link not found", "This signing link does not exist or was replaced by a newer one.");
        } else {
          statusCard("Something went wrong", "This signing link could not be loaded. Check your connection and try again.");
        }
        return;
      }
      if (payload.status === "cancelled") return statusCard("Request cancelled", "The requester cancelled this signature request.");
      if (payload.status === "signed") return statusCard("Already signed", "This document was already signed. Nothing else is needed.");
      if (payload.status === "expired") return statusCard("Link expired", "This signing link has expired. Ask the requester to send a new one.");
      if (payload.status === "pending") return showSigningUI(payload);
      statusCard("Something went wrong", "This signing link could not be loaded. Check your connection and try again.");
    })
    .catch(function () {
      statusCard("Something went wrong", "This signing link could not be loaded. Check your connection and try again.");
    });

  function showSigningUI(request) {
    var requester = (request.requesterName || "").trim() || "Someone";
    var expiresText = new Date(request.expiresAt).toUTCString();
    var messageBlock = request.message ? '<div class="msg">' + escapeHTML(request.message) + '</div>' : "";

    content.innerHTML = ''
      + '<div class="card">'
      + '  <h1>' + escapeHTML(requester) + ' asked you to sign</h1>'
      + '  <p class="sub">Review <span class="doc-title">' + escapeHTML(request.documentTitle) + '</span>, draw your signature below, then tap the exact spot on the document where it should appear. This link expires ' + escapeHTML(expiresText) + '.</p>'
      + messageBlock
      + '</div>'
      + '<div class="card">'
      + '  <label for="signer-name">Your full name</label>'
      + '  <input type="text" id="signer-name" autocomplete="name" placeholder="Full legal name" maxlength="120">'
      + '  <label>Draw your signature</label>'
      + '  <div class="sig-box">'
      + '    <canvas id="sig-canvas"></canvas>'
      + '    <div class="sig-hint" id="sig-hint">Sign here with your finger or mouse</div>'
      + '  </div>'
      + '  <div class="sig-actions"><button type="button" class="link-btn" id="sig-clear">Clear signature</button></div>'
      + '</div>'
      + '<div class="place-banner" id="place-banner"></div>'
      + '<div class="card">'
      + '  <h2>Document</h2>'
      + '  <p class="sub" id="doc-hint">Loading document…</p>'
      + '  <div id="pdf-pages"></div>'
      + '  <a class="pdf-link" id="pdf-open" target="_blank" rel="noopener">Open PDF in a new tab ↗</a>'
      + '</div>'
      + '<div class="card">'
      + '  <div class="consent">'
      + '    <input type="checkbox" id="consent">'
      + '    <span>' + escapeHTML(request.consentText) + '</span>'
      + '  </div>'
      + '  <button type="button" class="primary" id="submit-btn" disabled>Sign document</button>'
      + '  <div class="error" id="error-box"></div>'
      + '</div>'
      + '<div class="card success" id="done-card" style="display:none">'
      + '  <div class="status-icon">✅</div>'
      + '  <h1>Signed</h1>'
      + '  <p class="sub">Thank you. ' + escapeHTML(requester) + ' can now finish the document in Proofly.</p>'
      + '</div>';

    var pdfURL = FUNCTION_URL + "?token=" + encodeURIComponent(token) + "&asset=pdf";
    document.getElementById("pdf-open").href = pdfURL;

    // --- Shared state ---
    var hasInk = false;
    var previewAvailable = false;
    // Signer-chosen placement: zero-based page index + normalized center (origin top-left).
    var placement = null;
    var chip = null;

    var pagesHost = document.getElementById("pdf-pages");
    var docHint = document.getElementById("doc-hint");
    var placeBanner = document.getElementById("place-banner");

    // --- PDF preview (pdf.js with graceful fallback to the open-in-tab link) ---
    var script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    script.onload = function () {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      window.pdfjsLib.getDocument(pdfURL).promise.then(function (doc) {
        pagesHost.innerHTML = "";
        var maxPages = Math.min(doc.numPages, 25);
        var hostWidth = pagesHost.clientWidth || 528;
        var pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        // Placement unlocks with the first rendered page; one slow or broken page
        // must never block signing the rest of the document.
        function pageRendered() {
          if (previewAvailable) return;
          previewAvailable = true;
          docHint.style.display = "none";
          refreshPlacementUI();
        }

        function renderPage(pageNumber) {
          return doc.getPage(pageNumber).then(function (page) {
            var scale = Math.min(2, Math.max(0.8, (hostWidth * pixelRatio) / page.getViewport({ scale: 1 }).width));
            var viewport = page.getViewport({ scale: scale });
            var holder = document.createElement("div");
            holder.className = "pdf-page";
            holder.dataset.pageIndex = String(pageNumber - 1);
            var canvas = document.createElement("canvas");
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            holder.appendChild(canvas);
            var badge = document.createElement("div");
            badge.className = "page-num";
            badge.textContent = pageNumber + " / " + doc.numPages;
            holder.appendChild(badge);
            holder.addEventListener("pointerdown", onPagePointerDown);
            pagesHost.appendChild(holder);
            var rendered = page.render({ canvasContext: canvas.getContext("2d"), viewport: viewport }).promise
              .then(pageRendered);
            // Continue with the next page even if this one is still painting.
            return Promise.race([rendered, new Promise(function (resolve) { setTimeout(resolve, 15000); })]);
          }).catch(function () { /* skip broken page, keep the rest */ });
        }

        var chain = Promise.resolve();
        for (var index = 1; index <= maxPages; index += 1) {
          (function (pageNumber) {
            chain = chain.then(function () { return renderPage(pageNumber); });
          })(index);
        }
        chain.then(function () {
          if (!previewAvailable) return showPDFFallback();
          if (doc.numPages > maxPages) {
            var note = document.createElement("p");
            note.className = "sub";
            note.textContent = "Preview limited to " + maxPages + " pages. Open the PDF to see everything.";
            pagesHost.appendChild(note);
          }
        });
      }).catch(showPDFFallback);
    };
    script.onerror = showPDFFallback;
    document.head.appendChild(script);

    function showPDFFallback() {
      previewAvailable = false;
      docHint.textContent = "Preview unavailable in this browser. Use the link below to open the document; the requester's suggested position will be used for your signature.";
      updateSubmitState();
    }

    // --- Placement (tap a page to place, drag the chip to adjust) ---
    function refreshPlacementUI() {
      var placeable = previewAvailable && hasInk;
      Array.prototype.forEach.call(pagesHost.querySelectorAll(".pdf-page"), function (node) {
        node.classList.toggle("placeable", placeable);
      });
      if (!previewAvailable) { placeBanner.style.display = "none"; return; }
      if (!hasInk) {
        placeBanner.style.display = "none";
        removeChip();
        placement = null;
      } else if (!placement) {
        placeBanner.style.display = "block";
        placeBanner.classList.remove("placed");
        placeBanner.textContent = "Now tap the document where your signature should appear.";
      } else {
        placeBanner.style.display = "block";
        placeBanner.classList.add("placed");
        placeBanner.textContent = "Signature placed on page " + (placement.pageIndex + 1) + " — drag it to adjust.";
      }
      updateSubmitState();
    }

    function removeChip() {
      if (chip && chip.parentNode) chip.parentNode.removeChild(chip);
      chip = null;
    }

    function onPagePointerDown(event) {
      if (!hasInk || !previewAvailable) return;
      if (chip && chip.contains(event.target)) return;
      var holder = event.currentTarget;
      var rect = holder.getBoundingClientRect();
      placeChip(holder, (event.clientX - rect.left) / rect.width, (event.clientY - rect.top) / rect.height);
    }

    function placeChip(holder, normalizedX, normalizedY) {
      removeChip();
      chip = document.createElement("div");
      chip.className = "sig-chip";
      var img = document.createElement("img");
      img.src = sigCanvas.toDataURL("image/png");
      chip.appendChild(img);
      var hint = document.createElement("div");
      hint.className = "chip-hint";
      hint.textContent = "Drag to adjust";
      chip.appendChild(hint);
      holder.appendChild(chip);
      positionChip(holder, normalizedX, normalizedY);
      chip.addEventListener("pointerdown", startChipDrag);
      refreshPlacementUI();
    }

    function positionChip(holder, normalizedX, normalizedY) {
      var rect = holder.getBoundingClientRect();
      var chipWidth = rect.width * CHIP_WIDTH_FRACTION;
      var chipHeight = chipWidth * CHIP_ASPECT;
      var halfW = chipWidth / 2 / rect.width;
      var halfH = chipHeight / 2 / rect.height;
      var x = Math.min(Math.max(normalizedX, halfW), 1 - halfW);
      var y = Math.min(Math.max(normalizedY, halfH), 1 - halfH);
      chip.style.width = chipWidth + "px";
      chip.style.height = chipHeight + "px";
      chip.style.left = (x * rect.width - chipWidth / 2) + "px";
      chip.style.top = (y * rect.height - chipHeight / 2) + "px";
      placement = { pageIndex: Number(holder.dataset.pageIndex), x: x, y: y };
    }

    function startChipDrag(event) {
      event.preventDefault();
      event.stopPropagation();
      var holder = chip.parentNode;
      try { chip.setPointerCapture(event.pointerId); } catch (ignore) { /* synthetic or stale pointer */ }
      function onMove(moveEvent) {
        var rect = holder.getBoundingClientRect();
        positionChip(holder, (moveEvent.clientX - rect.left) / rect.width, (moveEvent.clientY - rect.top) / rect.height);
      }
      function onUp() {
        chip.removeEventListener("pointermove", onMove);
        chip.removeEventListener("pointerup", onUp);
        chip.removeEventListener("pointercancel", onUp);
        refreshPlacementUI();
      }
      chip.addEventListener("pointermove", onMove);
      chip.addEventListener("pointerup", onUp);
      chip.addEventListener("pointercancel", onUp);
    }

    // --- Signature canvas ---
    var sigCanvas = document.getElementById("sig-canvas");
    var hint = document.getElementById("sig-hint");
    var context = sigCanvas.getContext("2d");
    var drawing = false;
    var scale = window.devicePixelRatio || 1;

    function sizeCanvas() {
      var rect = sigCanvas.getBoundingClientRect();
      var snapshot = hasInk ? sigCanvas.toDataURL("image/png") : null;
      sigCanvas.width = rect.width * scale;
      sigCanvas.height = rect.height * scale;
      context.scale(scale, scale);
      context.lineWidth = 2.4;
      context.lineCap = "round";
      context.lineJoin = "round";
      context.strokeStyle = "#111118";
      if (snapshot) {
        var image = new Image();
        image.onload = function () { context.drawImage(image, 0, 0, rect.width, rect.height); };
        image.src = snapshot;
      }
    }
    sizeCanvas();
    window.addEventListener("resize", sizeCanvas);

    function pointerPosition(event) {
      var rect = sigCanvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }
    sigCanvas.addEventListener("pointerdown", function (event) {
      event.preventDefault();
      try { sigCanvas.setPointerCapture(event.pointerId); } catch (ignore) { /* synthetic or stale pointer */ }
      drawing = true;
      hasInk = true;
      hint.style.display = "none";
      var point = pointerPosition(event);
      context.beginPath();
      context.moveTo(point.x, point.y);
      context.lineTo(point.x + 0.01, point.y + 0.01);
      context.stroke();
      updateSubmitState();
    });
    sigCanvas.addEventListener("pointermove", function (event) {
      if (!drawing) return;
      event.preventDefault();
      var point = pointerPosition(event);
      context.lineTo(point.x, point.y);
      context.stroke();
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (name) {
      sigCanvas.addEventListener(name, function () {
        if (!drawing) return;
        drawing = false;
        // Refresh the placed chip so it always previews the latest strokes.
        if (chip) chip.querySelector("img").src = sigCanvas.toDataURL("image/png");
        refreshPlacementUI();
      });
    });

    document.getElementById("sig-clear").addEventListener("click", function () {
      context.setTransform(1, 0, 0, 1, 0, 0);
      context.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
      context.scale(scale, scale);
      hasInk = false;
      hint.style.display = "flex";
      refreshPlacementUI();
    });

    // --- Submit ---
    var nameInput = document.getElementById("signer-name");
    var consentInput = document.getElementById("consent");
    var submitButton = document.getElementById("submit-btn");
    var errorBox = document.getElementById("error-box");

    function updateSubmitState() {
      var placed = !previewAvailable || placement != null;
      submitButton.disabled = !(hasInk && placed && nameInput.value.trim().length > 1 && consentInput.checked);
    }
    nameInput.addEventListener("input", updateSubmitState);
    consentInput.addEventListener("change", updateSubmitState);

    submitButton.addEventListener("click", function () {
      submitButton.disabled = true;
      submitButton.textContent = "Signing…";
      errorBox.style.display = "none";
      var body = {
        token: token,
        signerName: nameInput.value.trim(),
        consent: consentInput.checked,
        signatureImageBase64: sigCanvas.toDataURL("image/png"),
      };
      if (placement) body.signaturePosition = placement;
      fetch(FUNCTION_URL + "?token=" + encodeURIComponent(token), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }).then(function (response) {
        return response.json().then(function (payload) { return { ok: response.ok, payload: payload }; });
      }).then(function (result) {
        if (!result.ok || !result.payload.signed) {
          throw new Error(result.payload && result.payload.error ? result.payload.error : "sign_failed");
        }
        document.getElementById("done-card").style.display = "block";
        document.getElementById("done-card").scrollIntoView({ behavior: "smooth" });
        submitButton.textContent = "Signed ✓";
        placeBanner.style.display = "none";
      }).catch(function (error) {
        var reasons = {
          request_expired: "This link has expired. Ask the requester for a new one.",
          request_cancelled: "This request was cancelled by the requester.",
          already_signed: "This document was already signed.",
          signaturePosition_invalid: "The signature position could not be read. Tap the document to place your signature again.",
        };
        errorBox.textContent = reasons[error.message] || "Signing failed. Check your connection and try again.";
        errorBox.style.display = "block";
        submitButton.textContent = "Sign document";
        updateSubmitState();
      });
    });
  }
})();
</script>
</body>
</html>
